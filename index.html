<h1>Personal rclone Google Drive client</h1>
<p>This is a private, single-user OAuth client used only by its owner to sync the owner's own files with the owner's own Google Drive using the open-source <a href="https://rclone.org/">rclone</a> tool. It is not offered to the public and has no other users.</p>
